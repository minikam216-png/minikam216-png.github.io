<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Олд Маркет</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #eef2f3; padding: 20px; color: #333; margin: 0; }
        h1 { color: #007bff; margin-top: 20px; font-size: 24px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        .app-card { background: white; padding: 20px; border-radius: 12px; margin: 15px auto; max-width: 340px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); border: 1px solid #e0e0e0; }
        .app-title { font-size: 18px; font-weight: bold; margin: 0 0 5px 0; }
        .app-version { color: #888; font-size: 12px; margin-bottom: 10px; }
        .app-desc { font-size: 14px; color: #555; margin-bottom: 15px; }
        .btn-download { display: inline-block; background: #28a745; color: white; padding: 12px 30px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; }
        .btn-download:hover { background: #218838; }
    </style>
</head>
<body>

    <h1>🚀 Мой Олд Маркет</h1>
    <div class="subtitle">Каталог софта для CyanogenMod 11</div>

    <!-- Карточка Оперы Мини -->
    <div class="app-card">
        <div class="app-title">Opera Mini</div>
        <div class="app-version">Версия: 7.0.1</div>
        <div class="app-desc">Легендарный быстрый браузер. Отлично экономит мобильный трафик на старых смартфонах.</div>
        <!-- Ссылка ведет прямо на твой файл opera.apk -->
        <a href="opera.apk" class="btn-download">Скачать APK</a>
    </div>

</body>
</html>
